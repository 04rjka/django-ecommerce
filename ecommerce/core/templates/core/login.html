{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="flex justify-center mx-auto min-h-screen items-center">
    <div class="border border-gray-300 rounded flex flex-col gap-3 p-4">

        <h1 class="text-2xl font-medium">Login</h1>
        <form action="" method="post" class="flex flex-col gap-2">
            {% csrf_token %}
            <div class="">
                <label class="">{{form.username.label}}</label>
                {{form.username}}
            </div>
            <div class="">
                <label class="">{{form.password.label}}</label>
                {{form.password}}
            </div>
            {% if messages %}
            {% for message in messages %}
            <div class="border border-gray-300 bg-blue-200 rounded p-4 shadow" role="alert">
                {{message}}
                
            </div>
            {% endfor %}
            {% endif %}
            <button class="rounded px-3 py-2 bg-purple-500 text-white text-xl" type="submit">Login</button>
            <div class="text-center">
                <a href="{% url 'customer_signup'  %}" class="text-blue-400">Don't have an account?</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
