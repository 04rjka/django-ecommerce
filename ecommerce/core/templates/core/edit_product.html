{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block body %}
{% include "staff_navbar.html" %}
<div class="mt-2 p-2 flex justify-center">
    <div class="flex flex-col p-4 gap-2 border border-gray-300 rounded shadow">
        <h1 class="text-2xl">Edit Product</h1>
        
            
                <form action="" method="post" enctype="multipart/form-data" class="flex flex-col gap-2">
                    {% csrf_token %}
                    {{ form.as_p}}
                    {{formset.management_form}}
                    {% for f in formset %}
                    {{f.as_p}}
                    {% endfor %}
                    <button class="bg-purple-400 rounded py-2 px-4 text-lg text-white" type="submit">ADD</button>
                </form>
            
        
    </div>
</div>
{% endblock %}
